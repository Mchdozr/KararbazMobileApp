appId: com.mchdozr.nereye
name: Kullanım istatistiği izni varsayılan kapalı, reddedilince bir daha sorulmaz
tags:
  - smoke
---
- launchApp:
    clearState: true
- tapOn: "Kadıköy ile başla"
- extendedWaitUntil:
    visible: "Sana özel"
    timeout: 45000
- scrollUntilVisible:
    element: "Kararbaz'ı geliştirmemize yardım eder misin?"
    direction: DOWN
- tapOn: "Kullanım istatistiğine izin verme"
- assertNotVisible: "Kararbaz'ı geliştirmemize yardım eder misin?"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Sana özel"
    timeout: 45000
- assertNotVisible: "Kararbaz'ı geliştirmemize yardım eder misin?"
- tapOn: "Profil"
- scrollUntilVisible:
    element: "Anonim kullanım istatistikleri"
    direction: DOWN
- assertVisible: "Anonim kullanım istatistikleri"
