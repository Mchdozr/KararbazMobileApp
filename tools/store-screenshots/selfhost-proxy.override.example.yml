# Yalnızca bu geliştirme konteyneri için: konteynerler internete ana makinedeki proxy üzerinden çıkar.
services:
  osm-download:
    network_mode: host
    environment:
      HTTPS_PROXY: http://127.0.0.1:39173
      https_proxy: http://127.0.0.1:39173
      CURL_CA_BUNDLE: /ccr/ca-bundle.crt
    volumes:
      - /root/.ccr/ca-bundle.crt:/ccr/ca-bundle.crt:ro
    entrypoint:
      - bash
      - -c
      - |
        printf 'Acquire::https::Proxy "http://127.0.0.1:39173";\nAcquire::https::CaInfo "/ccr/ca-bundle.crt";\n' > /etc/apt/apt.conf.d/99proxy
        sed -i 's|http://deb.debian.org|https://deb.debian.org|g' /etc/apt/sources.list.d/debian.sources
        exec bash /scripts/download-osm.sh
  overpass:
    environment:
      # Geofabrik bu ağdan erişilemez: fark güncellemesi bu denemede kapalı.
      OVERPASS_DIFF_URL: ""
