<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:F;src:url(../../apps/nereye-go/node_modules/@expo-google-fonts/fraunces/900Black/Fraunces_900Black.ttf)}
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:transparent}
body.bg{background:#f4dfbf}
svg{position:absolute;left:0;top:0}
</style></head><body>
<svg id="s" width="1024" height="1024" viewBox="0 0 1024 1024"></svg>
<script>
const q=new URLSearchParams(location.search);
const scale=+(q.get('scale')||0.86), mono=q.get('mono')==='1';
if(q.get('bg')==='1') document.body.classList.add('bg');
const G=mono?'#fff':'#0b3b29', O=mono?'#fff':'#e07b39', C=mono?'transparent':'#f4dfbf';
const s=document.getElementById('s');
const k=(1024*(1-scale))/2;
s.innerHTML=`<g transform="translate(${k} ${k}) scale(${scale}) translate(-25 -20)">
 <!-- katlanmış harita (üç kat) -->
 <g transform="translate(20 30)">
  <polygon points="170,790 380,735 500,805 290,860" fill="${G}"/>
  <polygon points="380,735 590,775 710,845 500,805" fill="${G}" opacity="${mono?1:0.78}"/>
  <polygon points="590,775 800,720 920,790 710,845" fill="${G}" opacity="${mono?1:0.9}"/>
  <path d="M250 818 C 330 790, 400 800, 470 785 S 600 810, 680 800 S 800 770, 860 768" fill="none" stroke="${C}" stroke-width="15" stroke-linecap="round"/>
 </g>
 <!-- K -->
 <text x="450" y="770" text-anchor="middle" font-family="F" font-size="820" fill="${G}" letter-spacing="-10">K</text>
 <!-- konum işareti -->
 <g transform="translate(760 262)">
  <path d="M0 150 C -70 60, -95 25, -95 -20 A 95 95 0 1 1 95 -20 C 95 25, 70 60, 0 150 Z" fill="${O}"/>
  <circle cx="0" cy="-20" r="38" fill="${mono?'transparent':C}" stroke="${mono?'#000':'none'}"/>
  <g stroke="${G}" stroke-width="16" stroke-linecap="round">
   <line x1="-70" y1="-150" x2="-95" y2="-190"/><line x1="0" y1="-160" x2="0" y2="-210"/><line x1="70" y1="-150" x2="95" y2="-190"/>
  </g>
 </g>
</g>`;
if(mono){ // delik: monokrom ikonda iç daire saydam
  s.querySelector('circle').setAttribute('fill','#000'); s.querySelector('circle').style.mixBlendMode='destination-out';
}
document.fonts.ready.then(()=>{window.done=true});
</script></body></html>
