version: "3.9"
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nereye
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nereye"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build:
      context: .
      dockerfile: src/Nereye.Api/Dockerfile
    ports:
      - "5079:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Database=nereye;Username=postgres;Password=postgres
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-change-me-32-chars-minimum!!}
      Redis__ConnectionString: redis:6379
      Database__UseInMemory: "false"
      Redis__UseMemory: "false"
      Places__UseFake: "false"
      # Anahtarı repoya yazma: kök dizindeki .env dosyasına GOOGLE_PLACES_API_KEY=... olarak koy.
      Places__ApiKey: ${GOOGLE_PLACES_API_KEY:-}
    volumes:
      - media:/app/wwwroot/media/uploads
      - avatars:/app/wwwroot/media/avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  admin:
    build:
      context: .
      dockerfile: src/Nereye.Admin/Dockerfile
    ports:
      - "5118:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Database=nereye;Username=postgres;Password=postgres
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-change-me-32-chars-minimum!!}
      Redis__ConnectionString: redis:6379
      Database__UseInMemory: "false"
      Redis__UseMemory: "false"
      Places__UseFake: "false"
    depends_on:
      - postgres
      - redis

# Veritabanı ve kullanıcı yüklemeleri `docker compose down` sonrası da kalsın.
volumes:
  pgdata:
  media:
  avatars:
