# Her push ve PR'da: iki backend test projesi ve istemci testleri + tip denetimi.
# Bilerek yok: mağaza derlemesi ya da yüklemesi (Expo bulut derlemesi, Play Console) ve sır gerektiren adım.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # PostgresMigrationTests (timestamptz geçişi) gerçek Postgres ister.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      NEREYE_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: dotnet test tests/Nereye.Domain.Tests
        run: dotnet test tests/Nereye.Domain.Tests
      - name: dotnet test tests/Nereye.Api.Tests
        run: dotnet test tests/Nereye.Api.Tests
      - name: Bilinen açığı olan NuGet paketi yok
        run: |
          dotnet list Nereye.slnx package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/nereye-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/nereye-go/package-lock.json
      - name: npm ci && npm test && npm run typecheck
        run: npm ci && npm test && npm run typecheck
      - name: npm audit (critical yok)
        run: npm audit --audit-level=critical

  # Web arayüzü uçtan uca (Playwright): API sahte veriyle, bellek içi veritabanıyla kendiliğinden başlar.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/nereye-go/package-lock.json
            e2e/package-lock.json
      - name: İstemci bağımlılıkları
        working-directory: apps/nereye-go
        run: npm ci
      - name: E2E bağımlılıkları ve Chromium
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: e2e
        run: npx playwright test --trace off
      - name: Rapor (yalnızca hata olursa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Android ana ekran bileşeni: eklentinin ürettiği Kotlin/XML derlenir, Robolectric ile çizilir, lint'ten geçer.
  android-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/nereye-go/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.9.2
      - name: Kaynakları eklentiden üret
        working-directory: apps/nereye-go
        run: npm ci && node --experimental-strip-types plugins/widget-check/generate.mts
      - name: Derle, test et, lint
        working-directory: apps/nereye-go/plugins/widget-check
        run: gradle --no-daemon testDebugUnitTest lintDebug
      - name: Önizleme
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-preview
          path: apps/nereye-go/plugins/widget-check/build/widget-preview-*.png
          retention-days: 7
